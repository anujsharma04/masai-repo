<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Auth Context Example</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- React + Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React App Code -->
    <script type="text/babel">
      const { createContext, useContext, useState } = React;

      // 1. Create AuthContext
      const AuthContext = createContext();

      // 2. Create AuthProvider
      const AuthProvider = ({ children }) => {
        const [isLoggedIn, setIsLoggedIn] = useState(false);

        const toggleAuth = () => setIsLoggedIn(prev => !prev);

        return (
          <AuthContext.Provider value={{ isLoggedIn, toggleAuth }}>
            {children}
          </AuthContext.Provider>
        );
      };

      // 3. Navbar Component
      const Navbar = () => {
        const { isLoggedIn, toggleAuth } = useContext(AuthContext);

        return (
          <nav style={{ background: '#222', color: '#fff', padding: '10px' }}>
            <button onClick={toggleAuth}>
              {isLoggedIn ? 'Logout' : 'Login'}
            </button>
          </nav>
        );
      };

      // 4. Main Component
      const Main = () => {
        const { isLoggedIn } = useContext(AuthContext);
        return (
          <main style={{ padding: '20px' }}>
            <h2>{isLoggedIn ? 'You are logged in!' : 'Please log in to continue.'}</h2>
          </main>
        );
      };

      // 5. Footer Component
      const Footer = () => {
        const { isLoggedIn } = useContext(AuthContext);
        return (
          <footer style={{ padding: '10px', background: '#f0f0f0' }}>
            {isLoggedIn ? 'Welcome, User 👋' : 'Please log in 🔐'}
          </footer>
        );
      };

      // 6. App Component
      const App = () => (
        <div style={{ fontFamily: 'Arial, sans-serif' }}>
          <Navbar />
          <Main />
          <Footer />
        </div>
      );

      // 7. Root Rendering
      ReactDOM.createRoot(document.getElementById('root')).render(
        <AuthProvider>
          <App />
        </AuthProvider>
      );
    </script>
  </body>
</html>
