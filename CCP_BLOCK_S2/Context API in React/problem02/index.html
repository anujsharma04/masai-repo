<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>React Theme Context Example</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- React + Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Your App Code -->
    <script type="text/babel">
      const { createContext, useContext, useState } = React;

      // 1. Create ThemeContext
      const ThemeContext = createContext();

      // 2. ThemeProvider component
      const ThemeProvider = ({ children }) => {
        const [theme, setTheme] = useState("light");

        const toggleTheme = () => {
          setTheme((prev) => (prev === "light" ? "dark" : "light"));
        };

        return (
          <ThemeContext.Provider value={{ theme, toggleTheme }}>
            {children}
          </ThemeContext.Provider>
        );
      };

      // 3. Nested component that uses the theme
      const NestedBox = () => {
        const { theme } = useContext(ThemeContext);

        const boxStyle = {
          backgroundColor: theme === "light" ? "#f0f0f0" : "#333",
          color: theme === "light" ? "#000" : "#fff",
          padding: "20px",
          borderRadius: "8px",
          marginTop: "15px",
        };

        return (
          <div style={boxStyle}>
            <h2>This is a {theme} themed box!</h2>
          </div>
        );
      };

      // 4. App component with toggle button
      const App = () => {
        const { theme, toggleTheme } = useContext(ThemeContext);

        return (
          <div style={{ padding: "30px", fontFamily: "Arial" }}>
            <h1>🎨 Theme Context Demo</h1>
            <button onClick={toggleTheme} style={{ padding: "10px 20px", marginBottom: "20px" }}>
              Toggle Theme ({theme})
            </button>
            <NestedBox />
          </div>
        );
      };

      // 5. Render App inside ThemeProvider
      const Root = () => (
        <ThemeProvider>
          <App />
        </ThemeProvider>
      );

      ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
    </script>
  </body>
</html>
