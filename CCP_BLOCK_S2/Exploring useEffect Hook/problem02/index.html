<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">

const {useState, useEffect} = React;

// Spinner component
function Spinner() {
  return <div style={{ marginTop: '15px' }}>⏳ Loading...</div>;
}

function QuoteApp() {
  const [quote, setQuote] = useState({ content: '', author: '' });
  const [loading, setLoading] = useState(false);
  const [fade, setFade] = useState(false);

  // Fetch quote from API
  const fetchQuote = async () => {
    setLoading(true);
    setFade(false);
    try {
      const response = await fetch('https://api.quotable.io/random');
      const data = await response.json();
      setQuote({ content: data.content, author: data.author });
      setTimeout(() => setFade(true), 100); // Delay for fade animation
    } catch (error) {
      setQuote({ content: 'Failed to fetch quote.', author: '' });
      setFade(true);
    } finally {
      setLoading(false);
    }
  };

  // Initial fetch and auto-refresh every 30s
  useEffect(() => {
    fetchQuote();
    const interval = setInterval(fetchQuote, 30000);
    return () => clearInterval(interval);
  }, []);

  const boxStyle = {
    maxWidth: '600px',
    margin: '60px auto',
    padding: '30px',
    backgroundColor: '#f0f8ff',
    borderRadius: '10px',
    boxShadow: '0 5px 20px rgba(0,0,0,0.1)',
    textAlign: 'center',
    transition: 'opacity 0.5s ease',
    opacity: fade ? 1 : 0.2,
  };

  const quoteText = {
    fontSize: '1.5rem',
    marginBottom: '15px',
    fontStyle: 'italic',
    color: '#333',
  };

  const authorText = {
    fontSize: '1.1rem',
    color: '#666',
  };

  const buttonStyle = {
    marginTop: '20px',
    padding: '10px 20px',
    fontSize: '1rem',
    borderRadius: '6px',
    border: 'none',
    cursor: 'pointer',
    backgroundColor: '#007bff',
    color: '#fff',
  };

  return (
    <div style={boxStyle}>
      <div style={quoteText}>“{quote.content}”</div>
      <div style={authorText}>— {quote.author}</div>

      {loading && <Spinner />}

      <button onClick={fetchQuote} style={buttonStyle} disabled={loading}>
        {loading ? 'Fetching...' : 'Get New Quote'}
      </button>
    </div>
  );
}

// Render App
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<QuoteApp />);
    </script>
</body>
</html>
