<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="root"></div>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { useState, useEffect } = React;
      function App() {
        const [data, setdata] = useState([]);
        const [filtredata, setfilterdata] = useState([]);
        const [input, setinput] = useState("");
        const [loding , setloding] = useState(false)

        useEffect(() => {
          async function getdata() {
            try {
              const response = await fetch(
                "https://jsonplaceholder.typicode.com/users"
              );
              const result = await response.json();
              setdata(result);
              setfilterdata(result);
            } catch (error) {
                console.log("Fetching Error" , error)
            }finally{
                setloding(true)
            }
          }

          getdata();
        }, []);

        const searchclick = (value) => {
          setinput(value);

          if (value === "") {
            setfilterdata(data);
          } else {
            const filterdata1 = data.filter((ele) =>
              ele.name.includes(value)
            );

            setfilterdata(filterdata1);
          }
        };

        // console.log(filtredata);

        // console.log(data);

        if(!loding){
            return <h2 style={{ textAlign: "center" }}>🔄 Loading users...</h2>;
        }

        return (
          <>
            <div style={{ padding: "20px", maxWidth: "600px", margin: "auto" }}>
              <input
                type="text"
                placeholder="Search By Name"
                onChange={(e) => searchclick(e.target.value)}
                style={{
                  padding: "10px",
                  width: "100%",
                  fontSize: "16px",
                  borderRadius: "5px",
                  border: "1px solid #ccc",
                  marginBottom: "20px",
                }}
              />

              {filtredata.map((ele) => (
                <div
                  key={ele.id}
                  style={{
                    backgroundColor: "#f9f9f9",
                    border: "1px solid #ddd",
                    borderRadius: "8px",
                    padding: "15px",
                    marginBottom: "15px",
                    boxShadow: "0 2px 5px rgba(0,0,0,0.05)",
                  }}
                >
                  <h2 style={{ margin: "0 0 5px", color: "#333" }}>
                    {ele.name}
                  </h2>
                  <p style={{ margin: "4px 0", color: "#555" }}>
                    <strong>Username:</strong> {ele.username}
                  </p>
                  <p style={{ margin: "4px 0", color: "#555" }}>
                    <strong>Email:</strong> {ele.email}
                  </p>
                </div>
              ))}
            </div>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
