<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Styled Web Page</title>
  <style>
    /* Page background */
    body {
      background-color: lightgray;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    /* Headings */
    h1 {
      color: navy;
    }

    h2 {
      color: darkred;
    }

    /* Paragraphs */
    .blue-paragraph {
      color: blue;
      font-size: 20px;
    }

    .green-paragraph {
      color: green;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Web Page</h1>
  <h2>Learning CSS Styling</h2>
