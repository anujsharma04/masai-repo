<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Props Drilling Example</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // BottomMainRight.jsx
    function BottomMainRight({ name }) {
      return (
        <div style={{ border: "1px solid green", padding: "10px", marginTop: "10px" }}>
          <h3>BottomMainRight Component</h3>
          <p>User's Name: <strong>{name}</strong></p>
        </div>
      );
    }

    // BottomMain.jsx
    function BottomMain({ name }) {
      return (
        <div style={{ border: "1px solid orange", padding: "10px" }}>
          <h2>BottomMain Component</h2>
          <BottomMainRight name={name} />
        </div>
      );
    }

    // Main.jsx
    function Main({ name }) {
      return (
        <div style={{ border: "1px solid blue", padding: "10px" }}>
          <h1>Main Component</h1>
          <BottomMain name={name} />
        </div>
      );
    }

    // App.jsx (Parent)
    function App() {
      const [name, setName] = React.useState("");

      return (
        <div style={{ padding: "20px", fontFamily: "Arial" }}>
          <h1>Props Drilling Example</h1>
          <input
            type="text"
            placeholder="Enter your name"
            value={name}
            onChange={(e) => setName(e.target.value)}
          />
          <Main name={name} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
